<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #667eea, #764ba2);
			color: #222;
		}
		.login-card {
			width: min(90%, 400px);
			padding: 2.5rem;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
		}
		h1 { margin: 0 0 .5rem; text-align: center; }
		.subtitle { margin: 0 0 1.8rem; text-align: center; color: #666; }
		label { display: block; margin: 1rem 0 .4rem; font-weight: bold; }
		input {
			width: 100%;
			padding: .8rem;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #667eea; border-color: transparent; }
		.options { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; font-size: .9rem; }
		.options label { margin: 0; font-weight: normal; }
		a { color: #5a67d8; text-decoration: none; }
		button {
			width: 100%;
			padding: .85rem;
			border: 0;
			border-radius: 6px;
			background: #5a67d8;
			color: white;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover { background: #434190; }
		.signup { margin: 1.5rem 0 0; text-align: center; color: #666; font-size: .9rem; }
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Welcome to our website</h1>
		<p class="subtitle">Log in to your account</p>
		<form action="#" method="post">
			<label for="email">Email address</label>
			<input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

			<div class="options">
				<label><input type="checkbox" name="remember"> Remember me</label>
				<a href="#">Forgot password?</a>
			</div>
			<button type="submit">Log In</button>
		</form>
		<p class="signup">Don't have an account? <a href="#">Sign up</a></p>
	</main>
</body>
</html>
